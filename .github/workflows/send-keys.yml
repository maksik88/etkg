name: Отправка ключей админу в Telegram

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "Тип ключа"
        required: true
        type: choice
        options:
          - Smart Security
          - Small Business Security
          - Internet Security
      keys:
        description: "Ключи, каждый с новой строки"
        required: true
        type: string

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Отправить ключи админу через бота
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ADMIN_ID: ${{ secrets.ADMIN_ID }}
          VARIANT: ${{ inputs.variant }}
          KEYS: ${{ inputs.keys }}
        run: |
          python3 - <<'PYEOF'
          import os, json, urllib.request
          keys = "\n".join(l.strip() for l in os.environ["KEYS"].splitlines() if l.strip())
          text = (
              f"🔑 <b>Новые ключи: {os.environ['VARIANT']}</b>\n\n"
              f"<pre>{keys}</pre>\n\n"
              f"Залейте в бота командой:\n"
              f"/add_keys {os.environ['VARIANT']}\n\n"
              f"(и вставьте ключи следующими строками)"
          )
          payload = json.dumps({
              "chat_id": os.environ["ADMIN_ID"],
              "text": text,
              "parse_mode": "HTML",
          }).encode()
          req = urllib.request.Request(
              f"https://api.telegram.org/bot{os.environ['BOT_TOKEN']}/sendMessage",
              data=payload,
              headers={"Content-Type": "application/json"},
          )
          print(urllib.request.urlopen(req, timeout=15).read().decode())
          PYEOF
